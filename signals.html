<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>株ダッシュボード</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--buy:#0f766e;--sell:#b91c1c;--acc:#1d4ed8;--soft:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--ink:#f3f4f6;--sub:#9ca3af;--line:#263041;--buy:#2dd4bf;--sell:#f87171;--acc:#60a5fa;--soft:#1e2638}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:8px 0 2px}h2{font-size:17px;margin:28px 0 10px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.alert{border:2px solid var(--sell)}
.name{font-size:18px;font-weight:700}.code{color:var(--sub);font-weight:400;font-size:14px;margin-left:6px}
.big{font-size:26px;font-weight:800;margin:4px 0 8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--buy)}.neg{color:var(--sell)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--acc)}
.tag.s{background:transparent;border:1px solid var(--sell);color:var(--sell)}
.btns{display:flex;gap:8px;margin-top:12px}
button{flex:1;font:inherit;font-weight:700;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dan{background:var(--sell);border-color:var(--sell);color:#fff}
.form{display:none;margin-top:12px}.form.on{display:block}
label{display:block;font-size:14px;color:var(--sub);margin-top:8px}
input{width:100%;font:inherit;font-size:18px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:20px 8px}
.note{font-size:14px;color:var(--sub);line-height:1.8}
</style>
</head>
<body>
<main>
<h1>株ダッシュボード</h1>
<div class="sub" id="upd">読み込み中…</div>

<h2>資金の内訳</h2>
<div class="card" id="money"></div>

<div id="sellbox"></div>

<h2>今日の買い候補</h2>
<div id="sig"></div>

<h2>保有中</h2>
<div id="hold"></div>

<h2>売却済み（あなたの実績）</h2>
<div class="card" id="done"></div>

<h2>候補全体の成績</h2>
<div class="card" id="track"></div>

<h2>過去5年の検証</h2>
<div class="card" id="bt"></div>

<h2>使い方</h2>
<div class="card note">
1. 普段は資金を日経平均ETF（例：1321）で持つ<br>
2. 買い候補が来たら、表示額だけETFを売り、翌朝に指値で買う<br>
3. 約定したら「買った」を押し、損切りの逆指値を置く<br>
4. 「売り」が表示されたら翌朝の寄りで売り、「売った」を押す<br>
5. 売った代金はETFに戻す<br><br>
記録はこのスマホのブラウザ内に保存されます。別の端末とは共有されません。
</div>
</main>
<script>
const CAP=7000000;
const yen=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ja-JP')+'円';
const sgn=n=>(n>0?'+':'')+yen(n);
const cls=n=>n>0?'pos':n<0?'neg':'';
const K='kabu00931_book';
function load(){try{return JSON.parse(localStorage.getItem(K))||{hold:[],done:[],skip:[]}}catch(e){return{hold:[],done:[],skip:[]}}}
function save(b){try{localStorage.setItem(K,JSON.stringify(b))}catch(e){}}
async function get(u){try{const r=await fetch(u+'?t='+Date.now());return r.ok?r.json():null}catch(e){return null}}
let S=null,B=null;

function toggle(id){document.getElementById(id).classList.toggle('on')}
function buy(i){
  const t=S.signals[i],b=load();
  const price=+document.getElementById('bp'+i).value, sh=+document.getElementById('bs'+i).value;
  if(!price||!sh)return;
  b.hold.push({code:t.code,name:t.name,date:t.date,price,shares:sh,stop:t.stop});
  save(b);render();
}
function skip(i){const t=S.signals[i],b=load();b.skip.push(t.date+t.code);save(b);render()}
function sell(j){
  const b=load(),h=b.hold[j];
  const px=+document.getElementById('sp'+j).value; if(!px)return;
  b.done.unshift({...h,sell:px,sellDate:new Date().toISOString().slice(0,10),pnl:(px-h.price)*h.shares});
  b.hold.splice(j,1);save(b);render();
}

function render(){
  const b=load(), q=(S&&S.quotes)||{};
  // 資金
  const inStock=b.hold.reduce((a,h)=>a+h.price*h.shares,0);
  document.getElementById('money').innerHTML=`
   <div class="row"><span>株に使っている額</span><b>${yen(inStock)}</b></div>
   <div class="row"><span>ETFで持つ目安</span><b>${yen(CAP-inStock)}</b></div>
   <div class="row"><span>計算</span><b>${yen(CAP)} − ${yen(inStock)}</b></div>`;
  // 売り指示（自分の保有分だけ）
  const alerts=b.hold.map((h,j)=>({h,j,qq:q[h.code]})).filter(x=>x.qq&&(x.qq.close<x.qq.sma25||x.qq.close<=x.h.stop));
  document.getElementById('sellbox').innerHTML=alerts.length?`<h2>売り指示</h2>`+alerts.map(({h,qq})=>`
   <div class="card alert"><span class="tag s">明日の寄りで売り</span>
    <div class="name" style="margin-top:6px">${h.name}<span class="code">${h.code}</span></div>
    <div class="note">${qq.close<=h.stop?`終値 ${yen(qq.close)} が損切り ${yen(h.stop)} 以下`:`終値 ${yen(qq.close)} が25日線 ${yen(qq.sma25)} を下回った`}</div>
   </div>`).join(''):'';
  // 買い候補
  const box=document.getElementById('sig');
  const sigs=(S&&S.signals||[]).map((t,i)=>({t,i})).filter(({t})=>!b.skip.includes(t.date+t.code)&&!b.hold.some(h=>h.code===t.code&&h.date===t.date));
  box.innerHTML=!sigs.length?'<div class="card empty">本日は買い候補なし</div>':sigs.map(({t,i})=>`
   <div class="card">
    <span class="tag">買い候補</span>
    <div class="name" style="margin-top:6px">${t.name}<span class="code">${t.code}</span></div>
    <div class="big">${t.shares.toLocaleString()}株</div>
    <div class="row"><span>指値（買い）</span><b>${yen(t.entry)}</b></div>
    <div class="row"><span>損切り</span><b class="neg">${yen(t.stop)}</b></div>
    <div class="row"><span>ETFを売る額</span><b>${yen(t.cost)}</b></div>
    <div class="row"><span>最大損失</span><b>${yen(t.risk_yen)}</b></div>
    <div class="note" style="margin-top:6px">
     株数＝ 70,000 ÷ (${t.entry.toLocaleString()} − ${t.stop.toLocaleString()}) → ${t.by_risk.toLocaleString()}株、
     1,400,000 ÷ ${t.entry.toLocaleString()} → ${t.by_cash.toLocaleString()}株 の小さい方
    </div>
    <div class="btns"><button class="pri" onclick="toggle('f${i}')">買った</button><button onclick="skip(${i})">見送り</button></div>
    <div class="form" id="f${i}">
     <label>約定した値段（円）</label><input id="bp${i}" type="number" inputmode="numeric" value="${t.entry}">
     <label>株数</label><input id="bs${i}" type="number" inputmode="numeric" step="100" value="${t.shares}">
     <div class="btns"><button class="pri" onclick="buy(${i})">記録する</button></div>
    </div>
   </div>`).join('');
  // 保有中
  document.getElementById('hold').innerHTML=!b.hold.length?'<div class="card empty">保有中の株はありません</div>':b.hold.map((h,j)=>{
    const qq=q[h.code], cur=qq?qq.close:null, pnl=cur?(cur-h.price)*h.shares:null;
    return `<div class="card">
     <div class="name">${h.name}<span class="code">${h.code}</span></div>
     <div class="big ${cls(pnl)}">${pnl==null?'—':sgn(pnl)}</div>
     <div class="row"><span>買値 × 株数</span><b>${yen(h.price)} × ${h.shares.toLocaleString()}</b></div>
     <div class="row"><span>現在値（終値）</span><b>${cur?yen(cur):'—'}</b></div>
     ${pnl!=null?`<div class="row"><span>損益の計算</span><b>(${cur.toLocaleString()} − ${h.price.toLocaleString()}) × ${h.shares.toLocaleString()}</b></div>`:''}
     <div class="row"><span>損切り</span><b class="neg">${yen(h.stop)}</b></div>
     <div class="row"><span>25日線（これを割ったら売り）</span><b>${qq?yen(qq.sma25):'—'}</b></div>
     <div class="row"><span>買った日</span><b>${h.date}の候補</b></div>
     <div class="btns"><button class="dan" onclick="toggle('s${j}')">売った</button></div>
     <div class="form" id="s${j}">
      <label>売った値段（円）</label><input id="sp${j}" type="number" inputmode="numeric" value="${cur||''}">
      <div class="btns"><button class="dan" onclick="sell(${j})">記録する</button></div>
     </div>
    </div>`}).join('');
  // 売却済み
  const tot=b.done.reduce((a,d)=>a+d.pnl,0), win=b.done.filter(d=>d.pnl>0).length;
  document.getElementById('done').innerHTML=!b.done.length?'<div class="empty">まだ売却した取引はありません</div>':`
   <div class="row"><span>合計損益</span><b class="${cls(tot)}">${sgn(tot)}</b></div>
   <div class="row"><span>予測出来た</span><b class="pos">${win}回</b></div>
   <div class="row"><span>予測出来なかった</span><b class="neg">${b.done.length-win}回</b></div>`+
   b.done.slice(0,20).map(d=>`<div class="row"><span>${d.name}<br><span class="sub">${d.sellDate}</span></span><b class="${cls(d.pnl)}">${sgn(d.pnl)}</b></div>`).join('');
  // 候補全体
  const tr=S&&S.track;
  document.getElementById('track').innerHTML=tr&&tr.closed?`
   <div class="row"><span>決着した候補</span><b>${tr.closed}件</b></div>
   <div class="row"><span>予測出来た</span><b class="pos">${tr.hit}件</b></div>
   <div class="row"><span>予測出来なかった</span><b class="neg">${tr.closed-tr.hit}件</b></div>
   <div class="row"><span>合計損益（指示通りの場合）</span><b class="${cls(tr.pnl)}">${sgn(tr.pnl)}</b></div>`
   :'<div class="empty">まだ決着した候補はありません</div>';
}

function renderBT(c){
  const el=document.getElementById('bt');
  const r=c&&c.results&&c.results['主要93×高値更新×待機資金を日経運用'];
  if(!r){el.innerHTML='<div class="empty">検証データなし</div>';return}
  el.innerHTML=`
   <div class="row"><span>この方式の5年の利益</span><b class="pos">${sgn(r.profit)}</b></div>
   <div class="row"><span>日経平均を持つだけ</span><b>${sgn(c.bench_profit)}</b></div>
   <div class="row"><span>差（日経に勝った分）</span><b class="${cls(r.profit-c.bench_profit)}">${sgn(r.profit-c.bench_profit)}</b></div>
   <div class="row"><span>売買の回数</span><b>${r.n}回</b></div>
   <div class="row"><span>予測出来た</span><b class="pos">${r.hit}回</b></div>
   <div class="row"><span>予測出来なかった</span><b class="neg">${r.miss}回</b></div>
   <div class="row"><span>最大の落ち込み</span><b class="neg">${yen(r.mdd)}</b></div>`;
}

(async()=>{
  S=await get('data/signals.json');
  document.getElementById('upd').textContent=S?`更新 ${S.updated}（${S.market_date} 終値で判定）`:'まだ判定データがありません';
  render();
  renderBT(await get('data/compare2.json'));
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
