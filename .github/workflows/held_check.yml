name: held-check
on:
  push:
    paths: ["scanner/held_check.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas xlrd
      - run: python scanner/held_check.py
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data && git commit -m "held_check $(date +%F)" && for _i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM%10+5)); done || echo "no change"
