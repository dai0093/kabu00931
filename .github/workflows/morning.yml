name: morning-reminder
on:
  schedule:
    - cron: "37 20 * * 0-5"   # 5:37 JST
    - cron: "11 21 * * 0-5"   # 6:11 JST
    - cron: "43 21 * * 0-5"   # 6:43 JST
    - cron: "23 22 * * 0-5"   # 7:23 JST（遅延対策で4回。最初の1回だけ送る）
  workflow_dispatch:
  push:
    paths: [".github/workflows/morning.yml", "scanner/morning.py", "scanner/risk_refresh.py", "scanner/risk.py"]
permissions:
  contents: write
  actions: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yfinance pandas
      - run: python3 scanner/risk_refresh.py || echo "市場リスク更新失敗"
        working-directory: .
        env: { PYTHONPATH: scanner }
      - run: python3 scanner/morning.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data/morning_sent.txt data/morning.json data/signals.json && git commit -m "morning sent" && git pull --rebase -X theirs && git push || echo "no change"
      - name: 途中判定ループが動いていなければ起動
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M); D=$(TZ=Asia/Tokyo date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 0600 ] && [ "$H" -lt 0840 ]; then
            NOW=$(TZ=Asia/Tokyo date +%s); TGT=$(TZ=Asia/Tokyo date -d "08:42" +%s); sleep $((TGT-NOW)); H=0842
          fi
          if [ "$D" -le 5 ] && [ "$H" -ge 0830 ] && [ "$H" -le 1450 ]; then
            N=$(gh run list -R ${{ github.repository }} -w intraday_loop.yml -s in_progress --json databaseId -q length 2>/dev/null || echo 0)
            Q=$(gh run list -R ${{ github.repository }} -w intraday_loop.yml -s queued --json databaseId -q length 2>/dev/null || echo 0)
            if [ "${N:-0}" = "0" ] && [ "${Q:-0}" = "0" ]; then gh workflow run intraday_loop.yml --ref main -R ${{ github.repository }} && echo "途中判定ループを起動"; else echo "稼働中"; fi
          fi
