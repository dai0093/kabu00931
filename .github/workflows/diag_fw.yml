name: diag_fw
on:
  push:
    paths: ["scanner/diag_fw.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install yfinance pandas
      - run: python scanner/diag_fw.py 2>&1 | tee data/diag_fw.txt
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data/diag_fw.txt && git commit -m "diag" && git pull --rebase && git push || echo "no change"
