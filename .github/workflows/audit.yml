name: audit
on:
  workflow_run:
    workflows: [finwatch]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance requests pandas xlrd openpyxl scikit-learn
      - run: python scanner/audit.py 2>&1 | tee data/audit_run.txt; exit ${PIPESTATUS[0]}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
      - if: always()
        run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data && git commit -m "audit $(date +%F)" && git pull --rebase -X theirs && git push || echo "no change"
