name: uicheck
on:
  workflow_run:
    workflows: [finwatch, jumps, morning-reminder]
    types: [completed]
  push:
    paths: ["signals.html","scanner/uicheck.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uicheck   # data-write に入れると、待機中の更新処理(finwatch)を取り消してしまうため別にする
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scanner/uicheck.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data/uicheck.json && git commit -m "uicheck" && git pull --rebase -X theirs && git push || echo "no change"
