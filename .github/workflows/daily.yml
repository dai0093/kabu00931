name: daily-scan
on:
  schedule:
    - cron: "27 7 * * 1-5"   # 平日 16:27 JST
    - cron: "13 8 * * 1-5"   # 平日 17:13 JST（遅延・失敗時の予備）
    - cron: "7 9 * * 1-5"    # 平日 18:07 JST（予備）
  workflow_dispatch:
  push:
    paths: ["scanner/daily.py", ".github/workflows/daily.yml"]
permissions:
  contents: write
concurrency: data-write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas cryptography
      - run: python scanner/daily.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          DASH_PASS: ${{ secrets.DASH_PASS }}
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data && git commit -m "daily scan $(date +%F)" && git pull --rebase && git push || echo "no change"
