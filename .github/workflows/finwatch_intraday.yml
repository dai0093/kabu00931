name: finwatch-intraday
on:
  schedule:
    # GitHubの定時実行は混雑時に落ちる・遅れるため、ずらして多めに置く（重複しても結果は同じ）
    - cron: "17 0 * * 1-5"    # 9:17 JST
    - cron: "47 0 * * 1-5"    # 9:47
    - cron: "23 1 * * 1-5"    # 10:23
    - cron: "53 1 * * 1-5"    # 10:53
    - cron: "19 2 * * 1-5"    # 11:19
    - cron: "41 3 * * 1-5"    # 12:41
    - cron: "13 4 * * 1-5"    # 13:13
    - cron: "43 4 * * 1-5"    # 13:43
    - cron: "17 5 * * 1-5"    # 14:17
    - cron: "47 5 * * 1-5"    # 14:47
    - cron: "19 6 * * 1-5"    # 15:19
    - cron: "40 9 * * 1-5"    # 18:40（欧州の取引中）
  workflow_dispatch:
  push:
    paths: [".github/workflows/finwatch_intraday.yml"]
permissions:
  contents: write
concurrency: data-write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install yfinance pandas jpholiday holidays
      - run: python3 scanner/finwatch.py
        env:
          INTRADAY: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python3 scanner/health.py || echo health失敗
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          for f in data/finwatch_intraday.json data/assets.json data/ah_sent.json data/health.json data/defense.json data/defense_intraday.json data/defense_sent.json; do [ -f $f ] && git add $f; done; git diff --cached --quiet && echo nochange ||  git commit -m "finwatch intraday (provisional)" && git pull --rebase -X theirs && git push || echo "no change"
