name: backtest
on:
  push:
    paths: ["scanner/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas
      - run: python scanner/backtest.py
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data && git commit -m "backtest $(date +%F)" && git pull --rebase && git push || echo "no change"
