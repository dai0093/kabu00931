name: logic-tree-notify
on:
  push:
    paths: ["data/logic_tree.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - run: python3 scanner/logic_notify.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - if: always()
        run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data/logic_notify_log.json && git commit -m "logic notify log" && git pull --rebase && git push || echo "no change"
