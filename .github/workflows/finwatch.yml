name: finwatch
on:
  schedule:
    - cron: "30 21 * * 0-4"   # 6:30 JST（前夜の米欧）
    - cron: "40 3 * * 1-5"    # 12:40 JST（前場後）
    - cron: "50 7 * * 1-5"    # 16:50 JST（東京引け後・欧州寄り付き）
    - cron: "10 22 * * 1-5"   # 7:10 JST
  workflow_dispatch:
  push:
    paths: [".github/workflows/finwatch.yml", "scanner/finwatch.py", "scanner/series_refresh.py", "scanner/logic_from_state.py"]
permissions:
  contents: write
concurrency: data-write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yfinance pandas
      - run: python3 scanner/series_refresh.py || echo "系列更新失敗"
      - run: python3 scanner/logic_from_state.py data/risk_state.json || echo "ロジックツリー再計算失敗"
      - run: python3 scanner/finwatch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data/finwatch.json data/finwatch_sent.json data/logic_tree.json data/series_live.json && git commit -m "finwatch" && git pull --rebase && git push || echo "no change"
