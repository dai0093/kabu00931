name: finwatch
on:
  schedule:
    - cron: "30 21 * * 0-4"   # 6:30 JST（前夜の米欧）
    - cron: "40 3 * * 1-5"    # 12:40 JST（前場後）
    - cron: "50 7 * * 1-5"    # 16:50 JST（東京引け後・欧州寄り付き）
    - cron: "10 22 * * 1-5"   # 7:10 JST
    - cron: "10 1 * * 6,0"    # 土日10:10 JST（遅れて届く米欧の終値を取り直す）
  workflow_dispatch:
  push:
    paths: [".github/workflows/finwatch.yml", "scanner/finwatch.py", "scanner/series_refresh.py", "scanner/logic_from_state.py"]
permissions:
  contents: write
  actions: write
concurrency: ${{ github.workflow }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install yfinance pandas scikit-learn jpholiday holidays
      - run: python3 scanner/series_refresh.py || echo "系列更新失敗"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python3 scanner/logic_from_state.py data/risk_state.json || echo "ロジックツリー再計算失敗"
      - run: python3 scanner/finwatch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python3 scanner/outlook.py || echo outlook失敗
      - run: python3 scanner/jumps.py || echo jumps失敗
      - run: python3 scanner/sectors.py || echo sectors失敗
      - run: python3 scanner/asset_rules.py || echo rules失敗
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python3 scanner/health.py || echo health失敗
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          for f in data/finwatch.json data/finwatch_sent.json data/logic_tree.json data/node_hist.json data/series_live.json data/assets.json data/ah_sent.json data/defense.json data/defense_intraday.json data/defense_sent.json data/defense_err.txt data/health.json data/outlook.json data/outlook_log.json data/defense_track.json data/nk_daily.json data/idx_daily.json data/jumps.json data/sox40_sent.json data/sectors.json data/sectors_hist.json data/asset_rules.json; do [ -f $f ] && git add $f; done; git diff --cached --quiet && echo nochange ||  git commit -m "finwatch" && for _i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM%10+5)); done || echo "no change"
      - name: 途中判定ループが動いていなければ起動
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M); D=$(TZ=Asia/Tokyo date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 0830 ] && [ "$H" -le 1450 ]; then
            N=$(gh run list -R ${{ github.repository }} -w intraday_loop.yml -s in_progress --json databaseId -q length 2>/dev/null || echo 0)
            Q=$(gh run list -R ${{ github.repository }} -w intraday_loop.yml -s queued --json databaseId -q length 2>/dev/null || echo 0)
            if [ "${N:-0}" = "0" ] && [ "${Q:-0}" = "0" ]; then gh workflow run intraday_loop.yml --ref main -R ${{ github.repository }} && echo "途中判定ループを起動"; else echo "稼働中"; fi
          fi
      - name: 監査と画面点検を起動（workflow_runはボット起動の更新では動かないため直接起動）
        if: always()
        run: |
          gh workflow run audit.yml -R ${{ github.repository }} || true
          gh workflow run uicheck.yml -R ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
