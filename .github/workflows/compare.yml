name: compare
on:
  push:
    paths: ["scanner/compare.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ${{ github.workflow }}   # 毎日の更新(data-write)を取り消さないよう別の列
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas
      - run: python scanner/compare.py
      - run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data && git commit -m "compare $(date +%F)" && git pull --rebase -X theirs && git push || echo "no change"
