name: compare95
on:
  push:
    paths: ["scanner/compare95.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas xlrd openpyxl scikit-learn lxml requests
      - run: python scanner/compare95.py 2>&1 | tee data/compare95_run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add data && git commit -m "compare95 $(date +%F)" && git pull --rebase -X theirs && git push || echo "no change"
